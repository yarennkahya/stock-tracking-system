{% extends 'base.html' %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4">
            <div class="card-body">
                <h2 class="mb-4">Giriş Yap</h2>

                {% if form.errors %}
                    <div class="alert alert-danger">Kullanıcı adı veya şifre hatalı.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
