<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Tracking System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #FAFAF8;
            --color-surface: #FFFFFF;
            --color-ink: #22303B;
            --color-steel: #3F5A72;
            --color-accent: #C96A0C;
            --color-accent-soft: #FBE7CD;
            --color-ok: #2E6B3E;
            --color-critical: #A32F22;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
        }

        html {
            font-size: 18px;
        }

        body {
            background: var(--color-bg);
            color: var(--color-ink);
            font-family: var(--font-body);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-body);
            font-weight: 700;
            color: var(--color-ink);
        }

        .app-navbar {
            background: var(--color-surface) !important;
            border-bottom: 3px solid var(--color-accent);
            padding-top: .75rem;
            padding-bottom: .75rem;
        }
        .app-navbar .navbar-brand {
            color: var(--color-ink) !important;
            font-weight: 700;
            font-size: 1.3rem;
        }
        .app-navbar .nav-link {
            color: var(--color-steel) !important;
            font-weight: 600;
            font-size: 1.05rem;
            padding: .5rem 1rem !important;
        }
        .app-navbar .nav-link:hover {
            color: var(--color-accent) !important;
        }

        .barcode-strip {
            height: 5px;
            background-image: repeating-linear-gradient(90deg,
                var(--color-accent) 0 3px, transparent 3px 6px,
                var(--color-accent) 6px 7px, transparent 7px 12px,
                var(--color-accent) 12px 16px, transparent 16px 20px);
            opacity: .5;
        }

        .btn {
            padding: .65rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
        }
        .btn-primary, .btn-outline-primary:hover {
            background-color: var(--color-accent) !important;
            border-color: var(--color-accent) !important;
        }
        .btn-outline-primary {
            color: var(--color-accent) !important;
            border-color: var(--color-accent) !important;
        }

        .badge {
            font-size: .9rem;
            padding: .5em .8em;
        }
        .badge.bg-danger { background-color: var(--color-critical) !important; }
        .badge.bg-success { background-color: var(--color-ok) !important; }

        .card {
            border: 1px solid #E5E7E4;
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        .card-body { padding: 1.75rem; }

        .table thead th {
            color: var(--color-steel);
            font-weight: 700;
            font-size: 1rem;
            border-bottom: 2px solid #E5E7E4;
        }
        .table td, .table th {
            padding: 1rem .9rem;
            vertical-align: middle;
            font-size: 1.02rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Stock Tracking System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
    {% if user.is_authenticated %}
        <li class="nav-item">
            <a class="nav-link" href="/">Ürünler</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/admin/">Admin Panel</a>
        </li>
        <li class="nav-item">
    <a class="nav-link" href="/satis/">Satış Ekranı</a>
</li>
        <li class="nav-item">
            <span class="nav-link">Merhaba, {{ user.username }}</span>
        </li>
        <li class="nav-item">
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-primary btn-sm">Çıkış Yap</button>
            </form>
        </li>
    {% endif %}
</ul>
            </div>
        </div>
    </nav>
    <div class="barcode-strip"></div>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
